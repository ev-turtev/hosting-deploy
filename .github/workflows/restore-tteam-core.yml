# restore.yml — зареждане на базата на приложение от бекъп (ТЕМПЛЕЙТ;
# попълва го setup-github.sh)
#
# ЗАМЕНЯ ЦЯЛАТА база. Ръчно: Actions -> Restore ... -> Run workflow:
#   - среда
#   - източник:
#       latest          — последният успешен Backup на тази среда
#       run:<номер>     — бекъпът от конкретно пускане на Backup (номерът е в адреса му)
#       release:<таг>   — .dump файл, качен като Release в това repo (напр. дъмп
#                         от стар сървър: Releases -> Draft a new release -> файлът)
#   - потвърждение: tteam/core/<среда>
#
# Поток: дъмпът -> временно в Storage на средата -> приложението се СПИРА ->
# старата база се изтрива -> нова празна база -> pg_restore (обект по обект, 2 потока)
# -> миграциите -> приложението се пуска (И ПРИ ГРЕШКА) -> копието се трие.
# Ролите и паролите им остават; потребителите идват от дъмпа.

name: Restore tteam/core
run-name: Restore tteam/core ${{ inputs.environment }} <- ${{ inputs.source }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Среда"
        required: true
        type: choice
        options:
          - prod
      source:
        description: "Източник: latest, run:<номер> или release:<таг>"
        required: true
        type: string
        default: latest
      confirm:
        description: "Потвърждение — напиши tteam/core/<среда> (ЦЯЛАТА база се заменя)"
        required: true
        type: string

permissions:
  id-token: write # Azure OIDC login
  contents: read # release:<таг>
  actions: read # latest / run:<номер> — artifact от друго пускане

jobs:
  restore:
    runs-on: ubuntu-24.04 # заковано: ubuntu-latest сменя версията сам
    environment: tteam-core-${{ inputs.environment }}
    concurrency:
      group: deploy-tteam-core-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLIENT: tteam
      APP: core
      ENV_NAME: ${{ inputs.environment }}
      SOURCE: ${{ inputs.source }}
      CONFIRM: ${{ inputs.confirm }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Потвърждение и източник
        id: src
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "${CLIENT}/${APP}/${ENV_NAME}" ]; then
            echo "::error::Потвърждението трябва да е точно ${CLIENT}/${APP}/${ENV_NAME} — нищо не е пипнато."
            exit 1
          fi
          case "$SOURCE" in
            latest)
              RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "backup-tteam-core.yml" --status success --limit 100 \
                --json databaseId,displayTitle --jq "[.[] | select(.displayTitle | endswith(\" ${ENV_NAME}\"))][0].databaseId // empty")
              [ -n "$RUN" ] || { echo "::error::няма успешен Backup за ${ENV_NAME}"; exit 1; }
              echo "kind=run" >> "$GITHUB_OUTPUT"; echo "run=$RUN" >> "$GITHUB_OUTPUT" ;;
            run:*)
              echo "kind=run" >> "$GITHUB_OUTPUT"; echo "run=${SOURCE#run:}" >> "$GITHUB_OUTPUT" ;;
            release:*)
              echo "kind=release" >> "$GITHUB_OUTPUT"; echo "tag=${SOURCE#release:}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::източникът е latest, run:<номер> или release:<таг>, а е '$SOURCE'"; exit 1 ;;
          esac

      - name: Бекъпът от пускане на Backup
        if: steps.src.outputs.kind == 'run'
        uses: actions/download-artifact@v7
        with:
          name: backup-${{ env.CLIENT }}-${{ env.APP }}-${{ env.ENV_NAME }}
          run-id: ${{ steps.src.outputs.run }}
          github-token: ${{ github.token }}
          path: restore

      - name: Файлът от Release
        if: steps.src.outputs.kind == 'release'
        run: gh release download "${{ steps.src.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern "*.dump" --dir restore

      - name: Проверка на дъмпа
        run: |
          set -euo pipefail
          FILES=$(find restore -name "*.dump" -type f)
          [ "$(echo "$FILES" | grep -c .)" = "1" ] || { echo "::error::очаквах точно един .dump файл, намерих: $FILES"; exit 1; }
          [ "$(head -c 5 "$FILES")" = "PGDMP" ] || { echo "::error::$FILES не е pg_dump -Fc"; exit 1; }
          echo "DUMP=$FILES" >> "$GITHUB_ENV"
          echo "дъмп: $FILES ($(du -h "$FILES" | cut -f1))"

      - name: Checkout (само помощните скриптове)
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/hosting
          path: hosting-repo

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Restore (в Azure)
        run: |
          set -euo pipefail
          H=hosting-repo/.github/hosting
          source "$H/job.sh"
          RG="${CLIENT}-${ENV_NAME}"
          PGTOOLS="${{ vars.ACR_LOGIN_SERVER }}/tools/pgtools:16"
          BLOB="transfer/${GITHUB_RUN_ID}-restore.dump"
          APP_ROLE=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query "properties.template.containers[0].env[?name=='DB_USER'].value | [0]" -o tsv)
          [ -n "$APP_ROLE" ] || { echo "::error::не намирам приложната DB роля (DB_USER)"; exit 1; }

          storage_init
          APP_STOPPED=no
          on_exit() {
            if [ "$APP_STOPPED" = "yes" ]; then
              echo "== приложението се пуска пак"
              app_power start && app_wait_status Running && echo "OK  $APP работи" \
                || echo "::error::$APP не тръгна — Azure портал -> Container App $APP -> Start"
            fi
            storage_delete "$BLOB"
            echo "копието в Storage е изтрито"
          }
          trap on_exit EXIT

          echo "== дъмпът -> Storage"
          az storage blob upload --account-name "$STORAGE" --account-key "$STORAGE_KEY" --container-name "$APP" \
            --name "$BLOB" --file "$DUMP" --overwrite --only-show-errors --output none
          storage_sas_url "$BLOB" r

          echo "== 0/4 спиране на приложението (държи връзка към базата)"
          APP_STOPPED=yes
          app_power stop
          app_wait_status Stopped

          echo "== 1/4 старата база: затваряне и изтриване"
          job_run_script "${APP}-dbinit" "$PGTOOLS" "$H/dbreset.sh"

          echo "== 2/4 нова празна база"
          job_run "${APP}-dbinit" || { sleep 60; job_run "${APP}-dbinit"; }

          echo "== 3/4 зареждане на дъмпа (обект по обект, 2 потока)"
          EXTRA=$(jq -n --arg u "$SAS_URL" --arg r "$APP_ROLE" '[{name: "DUMP_URL", value: $u}, {name: "APP_ROLE", value: $r}]')
          job_run_script "${APP}-dbinit" "$PGTOOLS" "$H/dbrestore.sh" "$EXTRA"

          if az containerapp job show --name "${APP}-migrate" --resource-group "$RG" --output none 2>/dev/null; then
            echo "== 4/4 миграциите (по-новите от образа + паролата на приложната роля)"
            job_run "${APP}-migrate"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Restore: ${CLIENT}/${APP}/${ENV_NAME} <- ${SOURCE}"
            echo "- Резултат: ${{ job.status }}"
            echo "- Дъмп: \`${DUMP:-—}\`"
            echo "- Приложението се пуска пак и при грешка. Ако резултатът е failure: базата може да е празна — пусни Restore пак с работещ източник."
          } >> "$GITHUB_STEP_SUMMARY"
